name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - preview

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint and format checks
        run: npm run check

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run check-types

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Write Vitest summary
        if: ${{ always() }}
        run: npm run test:summary

      - name: Upload unit test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: vitest-unit-report
          path: reports/vitest-unit.json
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests, migrations]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/m324_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: m324_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d m324_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare integration test database
        run: npm run db:push

      - name: Run integration tests
        run: npm run test:integration:ci

      - name: Write Vitest summary
        if: ${{ always() }}
        run: npm run test:summary

      - name: Upload integration test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: vitest-integration-report
          path: reports/vitest-integration.json
          if-no-files-found: ignore

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Drizzle migrations
        run: npm run db:check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, types, tests, integration-tests, migrations, audit]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

  deploy:
    name: Deploy marker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
    steps:
      - name: Report deployment target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Vercel will publish this commit to production (m324-web, m324-server)."
          else
            echo "Vercel will publish this commit as a preview deployment."
          fi
          echo "Deployment is handled by the Vercel Git integration; no CI-side action required."
