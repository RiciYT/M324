name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - preview

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint and format checks
        run: npm run check

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run check-types

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Prepare integration test database
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run db:push

      - name: Run integration tests
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run test:integration

      - name: Skip integration tests without test database
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "Integration tests require a Neon test database and DATABASE_URL secret in GitHub Actions."

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Drizzle migrations
        run: npm run db:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, types, tests, migrations]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')
    steps:
      - name: Report deployment target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Vercel will publish this commit to production (m324-web, m324-server)."
          else
            echo "Vercel will publish this commit as a preview deployment."
          fi
          echo "Deployment is handled by the Vercel Git integration; no CI-side action required."
